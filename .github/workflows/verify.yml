name: Verify DiskLizard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disklizard-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-27
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: bun install --frozen-lockfile
      - name: Lint the standalone DiskLizard source boundary
        run: bun run lint
      - name: Type-check the shared scanner
        run: bun run --cwd packages/disklizard typecheck
      - name: Type-check the shared UI source contract
        run: bun run --cwd packages/ui typecheck
      - name: Type-check desktop boundaries
        run: bun run --cwd packages/desktop typecheck
      - name: Test the native scanner
        run: cargo test --manifest-path packages/disklizard/native-scanner/Cargo.toml
      - name: Check native scanner formatting
        run: cargo fmt --manifest-path packages/disklizard/native-scanner/Cargo.toml -- --check
      - name: Lint the native scanner
        run: cargo clippy --manifest-path packages/disklizard/native-scanner/Cargo.toml -- -D warnings
      - name: Build the native sidecar used by desktop protocol tests
        run: bun run --cwd packages/disklizard native:build
      - name: Run every DiskLizard-specific test
        run: bun run test:disklizard
      - name: Type-check the storage interface
        run: bun run --cwd packages/app typecheck
      - name: Upload canonical test summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disklizard-test-summary-${{ matrix.os }}
          path: test-results/disklizard-summary.json
          if-no-files-found: error

  disk-utility-journey:
    name: rendered disk journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install the single browser used by the DiskLizard journey
        run: bunx playwright install chromium --with-deps
      - name: Type-check the browser contract
        run: bun run --cwd packages/app typecheck:e2e
      - name: Exercise scan, keyboard review, accessibility, and Trash intent
        run: bun run --cwd packages/app test:e2e:disk
      - name: Record the production-build interaction benchmark
        shell: bash
        run: |
          mkdir -p test-results
          bun run --cwd packages/app benchmark:disk-ui 2>&1 | tee test-results/disk-ui-benchmark.log
      - name: Upload rendered journey and benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disklizard-rendered-evidence
          path: |
            packages/app/e2e/test-results
            test-results/disk-ui-benchmark.log
          if-no-files-found: error

  packaged-smoke:
    name: packaged smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-27
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
      - name: Install Linux RPM packaging and archive inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends rpm rpm2cpio cpio
      - name: Build, package, and drive one frozen smoke identity end to end
        run: bun run --cwd packages/desktop verify:packaged-smoke
      - name: Upload packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disklizard-packaged-smoke-${{ matrix.os }}
          path: |
            test-results/packaged-smoke-*.json
            test-results/packaged-archives-*.json
            test-results/packaged-smoke-*/**
            packages/desktop/dist-smoke/builder-debug.yml
            packages/desktop/dist-smoke/*.dmg
            packages/desktop/dist-smoke/*.deb
            packages/desktop/dist-smoke/*.rpm
            packages/desktop/dist-smoke/*.zip
            packages/desktop/dist-smoke/*.exe
            packages/desktop/dist-smoke/*.AppImage
          if-no-files-found: error
