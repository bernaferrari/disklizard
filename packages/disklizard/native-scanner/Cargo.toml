[package]
name = "disklizard-scanner"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
libc = "0.2"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
